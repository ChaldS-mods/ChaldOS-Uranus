label: "ChaldOS-Live"
grub2:
  timeout: 3
  entries:
    - name: "Launch ChaldOS Installer"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=ChaldOS-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Launch ChaldOS Installer (Basic Graphics Mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=ChaldOS-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
